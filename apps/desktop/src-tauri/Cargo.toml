[package]
name = "aeria-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aeria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aeria-atlas = { path = "../../../crates/aeria-atlas" }
aeria-core = { path = "../../../crates/aeria-core" }
aeria-hsp = { path = "../../../crates/aeria-hsp" }
aeria-projects = { path = "../../../crates/aeria-projects" }
aeria-workspace = { path = "../../../crates/aeria-workspace" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.0"

[lints]
workspace = true

[dev-dependencies]
aeria-hxs = { path = "../../../crates/aeria-hxs" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
