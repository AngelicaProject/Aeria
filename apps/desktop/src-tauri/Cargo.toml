[package]
name = "aeria-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aeria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aeria-ai = { path = "../../../crates/aeria-ai" }
aeria-atlas = { path = "../../../crates/aeria-atlas" }
aeria-core = { path = "../../../crates/aeria-core" }
aeria-export = { path = "../../../crates/aeria-export" }
aeria-fonts = { path = "../../../crates/aeria-fonts" }
aeria-git = { path = "../../../crates/aeria-git" }
aeria-hsp = { path = "../../../crates/aeria-hsp" }
aeria-hxs = { path = "../../../crates/aeria-hxs" }
aeria-projects = { path = "../../../crates/aeria-projects" }
aeria-publish = { path = "../../../crates/aeria-publish" }
aeria-rebase = { path = "../../../crates/aeria-rebase" }
aeria-search = { path = "../../../crates/aeria-search" }
aeria-workspace = { path = "../../../crates/aeria-workspace" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.5"
tokio = { version = "1.53.1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
