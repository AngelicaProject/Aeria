[package]
name = "aeria-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aeria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aeria-atlas = { path = "../../../crates/aeria-atlas" }
aeria-core = { path = "../../../crates/aeria-core" }
aeria-hsp = { path = "../../../crates/aeria-hsp" }
aeria-workspace = { path = "../../../crates/aeria-workspace" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[lints]
workspace = true
