name: Pages

# Publishes the static landing page in site/ to GitHub Pages. The site is
# described in docs/development/website.md.
# workflow_run deploys only after a successful release and always checks
# out main, never the code of the run that triggered it.
on: # zizmor: ignore[dangerous-triggers]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Redeploy after each release so the download links name the new builds.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      # The page reads the current stable and nightly releases from this
      # snapshot. A channel without a release is recorded as null; any API
      # failure fails the deploy instead of publishing wrong links.
      - name: Snapshot releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            def pick: if . then {tag_name, published_at, html_url, assets: [.assets[] | {name, size, browser_download_url}]} else null end;
            {
              stable: (map(select((.draft | not) and (.prerelease | not))) | .[0] | pick),
              nightly: (map(select(.tag_name == "nightly")) | .[0] | pick)
            }' > site/releases.json
          cat site/releases.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1