name: Release

# Stable releases are published from version tags; the rolling nightly
# pre-release is rebuilt after every green CI run of a push to main. The
# release model is described in docs/development/releases.md.
#
# workflow_run runs with the release secrets, so it builds only pushes to
# main that passed CI, and the gate checks that the commit is main's head.
on: # zizmor: ignore[dangerous-triggers]
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  # A nightly is built only for the current head of main. CI for an older
  # merge can finish after a newer one landed; building it would publish an
  # outdated nightly, possibly without the release tooling it needs.
  gate:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.head.outputs.build }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$COMMIT" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $COMMIT: main is now at $head"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # aeria-check validates translation repositories in their CI. The merge
  # check workflow Aeria offers pins this archive by URL and SHA-256, which
  # the desktop build embeds, so the archive must never change: a stable one
  # is a release asset, and nightly ones accumulate under unique names in the
  # aeria-check-nightly pre-release, which the nightly job never deletes.
  check:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    # Built on the oldest supported runner so the binary runs on newer ones.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      name: ${{ steps.package.outputs.name }}
      url: ${{ steps.package.outputs.url }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      # setup-node v4 caches nothing without its cache input.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1

      # The same version as the desktop build below.
      - name: Determine the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version=$(node tools/release/version.mjs check --tag "$GITHUB_REF_NAME")
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(node tools/release/version.mjs nightly "$GITHUB_RUN_NUMBER")
            cargo update --workspace
            echo "tag=aeria-check-nightly" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build aeria-check
        run: cargo build --release --locked -p aeria-check

      - name: Package aeria-check
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name="aeria-check-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          tar --create --gzip --file "dist/$name" --directory target/release aeria-check
          sha256=$(sha256sum "dist/$name" | cut -d ' ' -f 1)
          {
            echo "name=$name"
            echo "sha256=$sha256"
            echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
          } >> "$GITHUB_OUTPUT"
          ./target/release/aeria-check --version

      - name: Publish the nightly aeria-check
        if: github.event_name == 'workflow_run'
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          if ! gh release view aeria-check-nightly > /dev/null 2>&1; then
            gh release create aeria-check-nightly \
              --prerelease --latest=false \
              --target "$COMMIT" \
              --title "aeria-check for nightly builds" \
              --notes "aeria-check archives of nightly Aeria builds. Merge check workflows pin one of them by name and SHA-256, so they are kept."
          fi
          gh release upload aeria-check-nightly "dist/$NAME"

      - name: Keep the stable aeria-check for the release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeria-check
          path: dist/${{ steps.package.outputs.name }}
          if-no-files-found: error

  windows:
    needs: [gate, check]
    if: needs.gate.outputs.build == 'true'
    # A newer nightly supersedes one that is still building; stable releases
    # never cancel each other. The group is on this job, not the workflow, so
    # only a run that passed the gate can cancel another: a late run for an
    # outdated commit must not cancel the build of the current head.
    concurrency:
      group: ${{ github.event_name == 'push' && format('release-{0}', github.ref_name) || 'release-nightly' }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      # setup-node v4 caches nothing without its cache input.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1

      - name: Require a green main commit for stable releases
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi
          # CI for the merge may still be running when the tag is pushed.
          for _ in $(seq 1 120); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=main&event=push" \
              --jq '[.workflow_runs[] | "\(.status):\(.conclusion)"] | join(" ")')
            case " $runs " in
              *" completed:success "*) echo "CI passed on main for $COMMIT"; exit 0 ;;
            esac
            case "$runs" in
              *in_progress*|*queued*|*requested*|*waiting*|*pending*) sleep 30 ;;
              *) echo "::error::CI has not passed on main for $COMMIT (runs: ${runs:-none})"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for CI on main for $COMMIT"
          exit 1

      - name: Determine the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version=$(node tools/release/version.mjs check --tag "$GITHUB_REF_NAME")
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(node tools/release/version.mjs nightly "$GITHUB_RUN_NUMBER")
            cargo update --workspace
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Aeria $version"

      - name: Stage pinned MinGit runtime
        run: pwsh -NoProfile -File tools/git/stage-mingit.ps1 -Target win-x64
      - run: pnpm install --frozen-lockfile

      - name: Build the application
        working-directory: apps/desktop
        env:
          # The aeria-check the merge check workflow pins.
          AERIA_CHECK_URL: ${{ needs.check.outputs.url }}
          AERIA_CHECK_SHA256: ${{ needs.check.outputs.sha256 }}
        run: pnpm tauri build --no-bundle -- --locked

      # Packaged before the installer so the executable carries no installer
      # bundle type: a portable copy announces updates but never installs them.
      - name: Package the portable build
        id: portable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="Aeria_${VERSION}_x64-portable"
          mkdir -p "dist/$name"
          cp target/release/aeria.exe "dist/$name/"
          cp -r target/release/git "dist/$name/git"
          (cd dist && 7z a -tzip -mx=9 "$name.zip" "$name" > /dev/null)
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Build the signed installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --bundles nsis

      - name: Fetch the stable aeria-check
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aeria-check
          path: dist

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.portable.outputs.zip }}
        run: |
          version="$VERSION"
          tag="$TAG"
          installer="Aeria_${version}_x64-setup.exe"
          cp "target/release/bundle/nsis/$installer" "target/release/bundle/nsis/$installer.sig" dist/
          node tools/release/version.mjs feed \
            --version "$version" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$installer" \
            --signature "dist/$installer.sig" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" > dist/latest.json
          # A stable release also carries aeria-check; a nightly does not.
          (cd dist && shopt -s nullglob && checks=(aeria-check-*.tar.gz) && sha256sum "$installer" "$(basename "$ZIP")" "${checks[@]}" > SHA256SUMS.txt)
          ls -la dist

      - name: Publish the stable release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --latest \
            --title "Aeria $version" \
            --generate-notes \
            dist/Aeria_*_x64-setup.exe dist/Aeria_*_x64-setup.exe.sig dist/Aeria_*_x64-portable.zip dist/latest.json dist/SHA256SUMS.txt \
            dist/aeria-check-*.tar.gz

      - name: Publish the nightly pre-release
        if: github.event_name == 'workflow_run'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease --latest=false \
            --target "$COMMIT" \
            --title "Aeria nightly $version" \
            --notes "Automatic build of main at $COMMIT. Nightly builds may contain bugs; use the stable channel for ordinary work." \
            dist/Aeria_*_x64-setup.exe dist/Aeria_*_x64-setup.exe.sig dist/Aeria_*_x64-portable.zip dist/latest.json dist/SHA256SUMS.txt
