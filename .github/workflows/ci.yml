name: CI

# Branches are checked through their pull requests; main is checked after
# every push, which the nightly release waits for.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Runs on main
# are never cancelled: a stable release waits for CI on its exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: |
          set -o pipefail
          pnpm --filter @aeria/desktop test:coverage | tee test-output.txt
          {
            echo "### Frontend coverage"
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: node --test tools/release/version.test.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: apps/desktop/lcov.info
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo fmt --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Coverage instrumentation on stable does not run doctests.
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - run: cargo test --workspace --locked --doc
      - name: Coverage report
        run: |
          cargo llvm-cov report --html
          {
            echo "### Rust coverage (Linux)"
            echo '<details><summary>Per file</summary>'
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-linux
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  po-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aeria-po --locked

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Stage pinned MinGit runtime
        run: pwsh -NoProfile -File tools/git/stage-mingit.ps1 -Target win-x64
      - run: cargo test -p aeria-projects --all-targets --locked
      - run: cargo test -p aeria-desktop --lib --locked
      - name: Test Git collaboration with the bundled MinGit
        shell: pwsh
        run: |
          $env:AERIA_GIT_PATH = (Resolve-Path apps/desktop/src-tauri/binaries/mingit/cmd/git.exe).Path
          cargo test -p aeria-git --all-targets --locked
      # Every file the path-handling suites create lives under a Cyrillic
      # folder with a space, as under a Russian Windows user profile. The
      # folder name stays short: SQLite on Windows does not accept paths
      # longer than 260 characters. These suites also measure the coverage
      # of Windows code.
      - name: Test path handling under a Cyrillic temporary folder
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "тест путей"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:TMP = $temp
          $env:TEMP = $temp
          $env:AERIA_GIT_PATH = (Resolve-Path apps/desktop/src-tauri/binaries/mingit/cmd/git.exe).Path
          cargo llvm-cov --no-report --locked --all-targets -p aeria-sqpack -p aeria-source -p aeria-po -p aeria-search -p aeria-projects -p aeria-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov --no-report --locked -p aeria-desktop --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Coverage report
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          {
            echo "### Rust coverage (Windows)"
            echo '<details><summary>Per file</summary>'
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-windows
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error
