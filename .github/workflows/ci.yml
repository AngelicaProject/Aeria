name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Stage pinned Harmonia Atlas sidecar
        run: sh tools/atlas/stage-sidecar.sh linux-x64
      - name: Smoke-test pinned Harmonia Atlas sidecar
        run: sh tools/atlas/smoke-test-sidecar.sh linux-x64
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  workspace-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test -p aeria-workspace --locked

  atlas-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Stage pinned Harmonia Atlas sidecar
        run: pwsh -NoProfile -File tools/atlas/stage-sidecar.ps1 -Target win-x64
      - name: Smoke-test pinned Harmonia Atlas sidecar
        run: pwsh -NoProfile -File tools/atlas/smoke-test-sidecar.ps1 -Target win-x64
      - name: Stage pinned MinGit runtime
        run: pwsh -NoProfile -File tools/git/stage-mingit.ps1 -Target win-x64
      - run: cargo test -p aeria-atlas --all-targets --locked
      - run: cargo test -p aeria-projects --all-targets --locked
      - run: cargo test -p aeria-desktop --lib --locked
      - name: Test Git collaboration with the bundled MinGit
        shell: pwsh
        run: |
          $env:AERIA_GIT_PATH = (Resolve-Path apps/desktop/src-tauri/binaries/mingit/cmd/git.exe).Path
          cargo test -p aeria-git --all-targets --locked
      # Every file the path-handling suites create lives under a Cyrillic
      # folder with a space, as under a Russian Windows user profile. The
      # folder name stays short: SQLite on Windows does not accept paths
      # longer than 260 characters.
      - name: Test path handling under a Cyrillic temporary folder
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "тест путей"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:TMP = $temp
          $env:TEMP = $temp
          $env:AERIA_GIT_PATH = (Resolve-Path apps/desktop/src-tauri/binaries/mingit/cmd/git.exe).Path
          cargo test --locked --all-targets -p aeria-hxs -p aeria-hsp -p aeria-workspace -p aeria-search -p aeria-projects -p aeria-atlas -p aeria-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p aeria-desktop --lib
