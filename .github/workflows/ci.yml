name: CI

# Aeria is released for Windows, so the application is checked on Windows.
# Linux checks only aeria-check, the one Linux binary Aeria publishes.
# docs/development/ci.md describes what each job guarantees.
#
# Branches are checked through their pull requests; main is checked after
# every push, which the nightly release waits for.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Runs on main
# are never cancelled: a stable release waits for CI on its exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: |
          set -o pipefail
          pnpm --filter @aeria/desktop test:coverage | tee test-output.txt
          {
            echo "### Frontend coverage"
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test release tooling
        run: node --test tools/release/version.test.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: apps/desktop/lcov.info
          if-no-files-found: error

  rust:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Stage pinned MinGit runtime
        run: pwsh -NoProfile -File tools/git/stage-mingit.ps1 -Target win-x64
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Every test file lives under a Cyrillic folder with a space, as under
      # a Russian Windows user profile, and Git is the bundled MinGit. The
      # folder name stays short: SQLite on Windows does not accept paths
      # longer than 260 characters.
      - name: Test with coverage
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "тест путей"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:TMP = $temp
          $env:TEMP = $temp
          $env:AERIA_GIT_PATH = (Resolve-Path apps/desktop/src-tauri/binaries/mingit/cmd/git.exe).Path
          cargo llvm-cov --workspace --all-targets --locked --no-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # cargo llvm-cov does not run doctests on stable Rust.
      - run: cargo test --workspace --locked --doc
      - name: Coverage report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only > coverage.txt
          {
            echo "### Rust coverage"
            echo '```text'
            head -n 1 coverage.txt
            tail -n 1 coverage.txt
            echo '```'
            echo '<details><summary>Per file</summary>'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-rust
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error
      # The floor sits below the current line coverage (77.7%). Raise it as
      # coverage grows; never lower it to pass a change.
      - name: Coverage floor
        run: cargo llvm-cov report --fail-under-lines 75

  # aeria-check runs in the CI of translation repositories on Linux; the
  # release builds it on the same runner.
  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p aeria-check --locked

  # Dependencies: known vulnerabilities, yanked crates, licenses, and sources
  # (deny.toml), and npm advisories for what the application ships.
  # Workflows: actionlint (with shellcheck) and zizmor.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-deny@0.20.2,zizmor@1.30.1
      - run: cargo deny --locked check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
          run_install: false
      - run: pnpm audit --prod
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint
          zizmor --format github .github/workflows

  # The one check the main ruleset requires: it passes only when every job
  # above passed, so jobs can change without changing the ruleset.
  ci:
    if: always()
    needs: [frontend, rust, check-linux, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
