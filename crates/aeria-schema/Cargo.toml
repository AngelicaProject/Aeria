[package]
name = "aeria-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Column names of the game's sheets from EXDSchema, checked against the game's sheet headers."

[dependencies]
aeria-core = { path = "../aeria-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
aeria-source = { path = "../aeria-source" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[lints]
workspace = true
