[package]
name = "aeria-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Validated deterministic runtime pack export."

[dependencies]
aeria-core = { path = "../aeria-core" }
aeria-fonts = { path = "../aeria-fonts" }
aeria-hxs = { path = "../aeria-hxs" }
aeria-se = { path = "../aeria-se" }
aeria-workspace = { path = "../aeria-workspace" }
brotli = "8.0.4"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
aeria-hsp = { path = "../aeria-hsp" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
