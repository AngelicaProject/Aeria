[package]
name = "aeria-po"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The project as PO files: the format, entry identity, file layout, files made from the game, and game updates."

[dependencies]
aeria-knowledge = { path = "../aeria-knowledge" }
aeria-se = { path = "../aeria-se" }
aeria-source = { path = "../aeria-source" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
aeria-sqpack = { path = "../aeria-sqpack", features = ["testing"] }
tempfile = "3.27.0"
