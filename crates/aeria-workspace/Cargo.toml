[package]
name = "aeria-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sparse translation workspace domain operations, Workspace Format persistence, and source update application."

[dependencies]
aeria-core = { path = "../aeria-core" }
aeria-hsp = { path = "../aeria-hsp" }
aeria-hxs = { path = "../aeria-hxs" }
aeria-rebase = { path = "../aeria-rebase" }
aeria-se = { path = "../aeria-se" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
