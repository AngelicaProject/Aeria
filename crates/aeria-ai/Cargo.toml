[package]
name = "aeria-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral AI translation orchestration and response validation."

[dependencies]
aeria-se = { path = "../aeria-se" }
base64 = "0.23.1"
csv = "1.4.0"
fs2 = "0.4.3"
html2text = "0.17.1"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt"] }
