[workspace]
resolver = "2"
members = [
  "crates/aeria-core",
  "crates/aeria-projects",
  "crates/aeria-se",
  "crates/aeria-sqpack",
  "crates/aeria-source",
  "crates/aeria-search",
  "crates/aeria-knowledge",
  "crates/aeria-git",
  "crates/aeria-export",
  "crates/aeria-fonts",
  "crates/aeria-publish",
  "crates/aeria-check",
  "crates/aeria-po",
  "crates/aeria-model",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/AngelicaProject/Aeria"
authors = ["AngelicaProject contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
