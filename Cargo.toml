[workspace]
resolver = "2"
members = [
  "crates/aeria-core",
  "crates/aeria-atlas",
  "crates/aeria-projects",
  "crates/aeria-hxs",
  "crates/aeria-hsp",
  "crates/aeria-se",
  "crates/aeria-workspace",
  "crates/aeria-rebase",
  "crates/aeria-search",
  "crates/aeria-ai",
  "crates/aeria-git",
  "crates/aeria-export",
  "tools/workspace-format-evaluation",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/AngelicaProject/Aeria"
authors = ["AngelicaProject contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
